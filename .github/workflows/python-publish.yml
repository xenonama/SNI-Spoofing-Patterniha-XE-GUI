# This workflow will build .exe files, create setup installer, and ZIP files when a release is created

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build GUI .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "SNI-Spoofing-GUI" gui.py --distpath ./dist --workpath ./build --specpath ./build

      - name: Build CLI .exe with PyInstaller
        run: |
          pyinstaller --onefile --console --name "SNI-Spoofing-CLI" main.py --distpath ./dist --workpath ./build --specpath ./build

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 5

  create-project-zip:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Create project ZIP file
        run: |
          mkdir -p release-files
          zip -r release-files/SNI-Spoofing-Patterniha.zip . -x ".git/*" ".github/*" "build/*" "dist/*" "__pycache__/*" "*.pyc"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-zip
          path: release-files/SNI-Spoofing-Patterniha.zip
          retention-days: 5

  create-setup-installer:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build setup installer
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 5

  attach-files-to-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows-exe
      - create-project-zip
      - create-setup-installer
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./exe-files/

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: project-zip
          path: ./zip-files/

      - name: Download setup artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: ./dist-files/

      - name: Upload files to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./exe-files/*.exe
            ./zip-files/*.zip
            ./dist-files/*
