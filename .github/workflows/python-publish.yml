# This workflow will build .exe files using exporter.py and create ZIP files when a release is published

name: Build Windows Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executables with exporter.py
        run: |
          python exporter.py --zip --mode onefile
        
      - name: List dist contents
        run: |
          dir dist /B
          echo "---"
          Get-ChildItem -Recurse dist

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SNI-Spoofer.exe
            dist/sni-backend.exe
            dist/*.zip
            dist/README.txt
            dist/config.json
            dist/ip_list.txt
            dist/sni_list.txt
            dist/xray_config.json
