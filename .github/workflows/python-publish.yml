# This workflow will build .exe files and upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build GUI .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "SNI-Spoofing-GUI" gui.py --distpath ./dist --workpath ./build --specpath ./build

      - name: Build CLI .exe with PyInstaller
        run: |
          pyinstaller --onefile --console --name "SNI-Spoofing-CLI" main.py --distpath ./dist --workpath ./build --specpath ./build

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 5

  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 5

  attach-files-to-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows-exe
      - release-build
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./exe-files/

      - name: Download wheel/source artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: ./dist-files/

      - name: Upload files to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./exe-files/*.exe
            ./dist-files/*

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
