# اسم این کار (Workflow) که در گیت‌هاب می‌بینی
name: ساخت فایل اجرایی ویندوز

# مشخص می‌کنیم چه زمانی این کار اجرا شود
on:
  # وقتی یک تگ جدید (مثل v1.0.0) به مخزن فرستادی
  push:
    tags:
      - 'v*'
  # این خط رو اضافه کردم تا بتوانی به‌صورت دستی هم از دکمه اجرا کنی (خیلی مفید است)
  workflow_dispatch:

jobs:
  build:
    # از یک سرور ویندوزی استفاده کن (چون می‌خواهیم خروجی .exe بگیریم)
    runs-on: windows-latest

    steps:
      # 1. کدهای پروژه را از گیت‌هاب دانلود کن
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      # 2. پایتون را نصب کن (نسخه 3.11)
      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. وابستگی‌های مورد نیاز را نصب کن
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. ساخت فایل exe برای رابط کاربری (GUI)
      - name: ساخت SNI-Spoofer.exe
        run: |
          pyinstaller --noconfirm --clean `
            --name "SNI-Spoofer" `
            --onefile `
            --windowed `
            --uac-admin `
            --collect-all pydivert `
            --paths . `
            gui.py

      # 5. ساخت فایل exe برای قسمت پشتیبان (Backend)
      - name: ساخت sni-backend.exe
        run: |
          pyinstaller --noconfirm --clean `
            --name "sni-backend" `
            --onefile `
            --console `
            --uac-admin `
            --collect-all pydivert `
            --paths . `
            main.py

      # 6. فایل‌های جانبی (تنظیمات و لیست‌ها) را کنار فایل‌های exe کپی کن
      - name: کپی فایل‌های داده
        run: |
          copy config.json dist\
          copy ip_list.txt dist\
          copy sni_list.txt dist\
          copy xray_config.json dist\

      # 7. همه چیز را در بخش Releases گیت‌هاب آپلود کن
      - name: آپلود در بخش انتشار (Release)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
