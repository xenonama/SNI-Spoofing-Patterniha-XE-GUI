# .github/workflows/build.yml
# ساخت فایل‌های اجرایی ویندوز (SNI-Spoofer.exe و sni-backend.exe)

name: ساخت فایل اجرایی ویندوز

# زمان اجرا: وقتی تگ جدید بزنید یا به‌صورت دستی اجرا کنید
on:
  push:
    tags:
      - 'v*'              # هر تگی که با v شروع شود (مثل v1.0.0, v2.3.1)
  workflow_dispatch:      # اجازه‌ی اجرای دستی از برگه‌ی Actions

# دسترسی‌ها: برای آپلود فایل در ریلیز نیاز به نوشتن داریم
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # سرور ویندوزی (برای ساخت .exe ضروری است)

    steps:
      # 1. دریافت کدهای پروژه از مخزن
      - name: دریافت کد
        uses: actions/checkout@v4

      # 2. نصب پایتون نسخه‌ی 3.11
      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. نصب وابستگی‌ها (پکیج‌های مورد نیاز)
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. ساخت فایل اجرایی رابط کاربری (GUI)
      - name: ساخت SNI-Spoofer.exe
        run: |
          pyinstaller --noconfirm --clean `
            --name "SNI-Spoofer" `
            --onefile `
            --windowed `
            --uac-admin `
            --collect-all pydivert `
            --paths . `
            gui.py

      # 5. ساخت فایل اجرایی بک‌اند (Injector)
      - name: ساخت sni-backend.exe
        run: |
          pyinstaller --noconfirm --clean `
            --name "sni-backend" `
            --onefile `
            --console `
            --uac-admin `
            --collect-all pydivert `
            --paths . `
            main.py

      # 6. کپی فایل‌های جانبی (تنظیمات و لیست‌ها) در کنار فایل‌های exe
      - name: کپی فایل‌های داده
        run: |
          copy config.json dist\
          copy ip_list.txt dist\
          copy sni_list.txt dist\
          copy xray_config.json dist\

      # 7. آپلود تمام فایل‌های موجود در پوشه‌ی dist به ریلیز
      - name: آپلود در ریلیز
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
